AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Manner-Volt backend (API Gateway + Lambda + DynamoDB)

Parameters:
  HomeStationId:
    Type: String
    Default: GV000001
    AllowedPattern: "^[A-Z0-9]{2,12}$"
  NearbyStationIds:
    Type: String
    Default: ""
    Description: 쉼표로 구분한 주변 충전소 statId 목록

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    CodeUri: src/
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        TOKEN_SECRET_ARN: !Ref TokenSecret
        PUBLIC_API_SECRET_ARN: !Ref PublicApiSecret
        HOME_STATION_ID: !Ref HomeStationId
        NEARBY_STATION_IDS: !Ref NearbyStationIds

Resources:
  # SECURITY-01: 저장 시 KMS 암호화, PITR
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # SECURITY-12: 비밀 값은 Secrets Manager. 공공 API 키는 배포 후 직접 넣는다.
  TokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Manner-Volt device token signing key
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
  PublicApiSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: data.go.kr EvCharger service key (set value after deploy)
      SecretString: CHANGE_ME

  # SECURITY-02, 14: 접근 로그, 90일 보관
  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 90
  ApiFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 90
  SweeperFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SweeperFunction}
      RetentionInDays: 90

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      EndpointConfiguration: REGIONAL
      # SECURITY-11: 스로틀링
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
          MetricsEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","resource":"$context.resourcePath","status":"$context.status","latency":"$context.responseLatency","time":"$context.requestTime"}'

  # SECURITY-06: 함수별 최소 권한 (와일드카드 리소스 없음)
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.api
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem, dynamodb:Query]
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: [!Ref TokenSecret, !Ref PublicApiSecret]
      Events:
        Register: { Type: Api, Properties: { RestApiId: !Ref Api, Path: /v1/devices, Method: POST } }
        Refresh: { Type: Api, Properties: { RestApiId: !Ref Api, Path: /v1/devices/refresh, Method: POST } }
        Board: { Type: Api, Properties: { RestApiId: !Ref Api, Path: "/v1/stations/{stationId}/board", Method: GET } }
        Nearby: { Type: Api, Properties: { RestApiId: !Ref Api, Path: /v1/stations/nearby, Method: GET } }
        Match: { Type: Api, Properties: { RestApiId: !Ref Api, Path: "/v1/stations/{stationId}/match", Method: GET } }
        Session: { Type: Api, Properties: { RestApiId: !Ref Api, Path: /v1/sessions, Method: PUT } }
        Departure: { Type: Api, Properties: { RestApiId: !Ref Api, Path: /v1/sessions/departure, Method: POST } }
        QueueJoin: { Type: Api, Properties: { RestApiId: !Ref Api, Path: "/v1/chargers/{chargerKey}/queue", Method: POST } }
        QueueLeave: { Type: Api, Properties: { RestApiId: !Ref Api, Path: "/v1/chargers/{chargerKey}/queue", Method: DELETE } }
        Arrival: { Type: Api, Properties: { RestApiId: !Ref Api, Path: "/v1/chargers/{chargerKey}/arrival-check", Method: POST } }
        Me: { Type: Api, Properties: { RestApiId: !Ref Api, Path: /v1/me, Method: GET } }
        Events: { Type: Api, Properties: { RestApiId: !Ref Api, Path: /v1/events, Method: GET } }

  SweeperFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.sweep
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query]
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref PublicApiSecret
      Events:
        EveryMinute:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 minute)

Outputs:
  ApiBaseUrl:
    Description: local.properties 의 MANNERVOLT_API_BASE_URL 값
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod
  PublicApiSecretArn:
    Value: !Ref PublicApiSecret
